[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "car-music-manager"
version = "0.2.0"
description = "Safe batch audio preparation for car USB playback"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "car-music-manager contributors"}]
dependencies = [
  "mutagen>=1.47",
  "Pillow>=11.0",
  "psutil>=5.9",
  "PySide6>=6.8,<7",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
car-music = "car_music_manager.cli:main"
car-music-gui = "car_music_manager.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Ruff formatter is authoritative for line wrapping.
